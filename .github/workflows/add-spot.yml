name: Add Spot

on:
  workflow_dispatch:
    inputs:
      spotName:
        description: 'スポット名'
        required: true
      mapUrl:
        description: 'Google マップ URL'
        required: false
      category:
        description: 'カテゴリ'
        required: false
      area:
        description: 'エリア'
        required: false
      environment:
        description: '屋内 / 屋外'
        required: false
      ageGroup:
        description: '年齢適性'
        required: false
      hasVehicle:
        description: '乗り物要素あり'
        required: false
        default: 'false'

jobs:
  add-spot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add spot to Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_MAP }}
          NOTION_DATABASE_ID: ${{ secrets.DATABASE_ID }}
          SPOT_NAME: ${{ inputs.spotName }}
          SPOT_MAP_URL: ${{ inputs.mapUrl }}
          SPOT_CATEGORY: ${{ inputs.category }}
          SPOT_AREA: ${{ inputs.area }}
          SPOT_ENVIRONMENT: ${{ inputs.environment }}
          SPOT_AGE_GROUP: ${{ inputs.ageGroup }}
          SPOT_HAS_VEHICLE: ${{ inputs.hasVehicle }}
        run: python3 scripts/add-spot.py

      - name: Fetch updated Notion data
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_MAP }}
          NOTION_DATABASE_ID: ${{ secrets.DATABASE_ID }}
        run: python3 scripts/fetch-notion.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "chore: add spot '${{ inputs.spotName }}' [skip ci]"
          git pull --rebase origin main
          git push
