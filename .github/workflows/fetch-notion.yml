name: Fetch Notion Data

on:
  schedule:
    # 毎日 0:00 JST (15:00 UTC) に自動更新
    - cron: '0 15 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        id: check
        run: |
          if [ -z "${{ secrets.NOTION_MAP }}" ] || [ -z "${{ secrets.DATABASE_ID }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::NOTION_MAP または DATABASE_ID が未設定です。Settings > Secrets and variables > Actions で登録してください。"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch Notion database
        if: steps.check.outputs.skip == 'false'
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_MAP }}
          NOTION_DATABASE_ID: ${{ secrets.DATABASE_ID }}
        run: python3 scripts/fetch-notion.py

      - name: Commit updated data
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "chore: update Notion data [skip ci]"
          git push
