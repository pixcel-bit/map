name: Update Spot

on:
  workflow_dispatch:
    inputs:
      spotId:
        description: 'Notion page ID'
        required: true
      visited:
        description: '行ったことある (true / false / 空=変更なし)'
        required: false
        default: ''
      memo:
        description: 'メモ (空文字=クリア, __SKIP__=変更なし)'
        required: false
        default: '__SKIP__'

jobs:
  update-spot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update spot in Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          SPOT_ID: ${{ inputs.spotId }}
          SPOT_VISITED: ${{ inputs.visited }}
          SPOT_MEMO: ${{ inputs.memo }}
        run: python3 scripts/update-spot.py

      - name: Fetch updated Notion data
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python3 scripts/fetch-notion.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "chore: update spot data [skip ci]"
          git pull --rebase origin main
          git push
