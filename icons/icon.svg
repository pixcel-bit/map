<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- v2 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-10%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.28)"/>
    </filter>
  </defs>

  <!-- Full background (maskable対応、コーナーの透明防止) -->
  <rect width="512" height="512" fill="#22c55e"/>
  <!-- Gradient overlay with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle map grid -->
  <line x1="80" y1="170" x2="432" y2="170" stroke="rgba(255,255,255,0.10)" stroke-width="2"/>
  <line x1="80" y1="360" x2="432" y2="360" stroke="rgba(255,255,255,0.10)" stroke-width="2"/>
  <line x1="170" y1="80" x2="170" y2="432" stroke="rgba(255,255,255,0.10)" stroke-width="2"/>
  <line x1="360" y1="80" x2="360" y2="432" stroke="rgba(255,255,255,0.10)" stroke-width="2"/>

  <!-- Small secondary dots -->
  <circle cx="138" cy="320" r="9" fill="rgba(255,255,255,0.30)"/>
  <circle cx="374" cy="340" r="7" fill="rgba(255,255,255,0.25)"/>
  <circle cx="152" cy="398" r="6" fill="rgba(255,255,255,0.20)"/>
  <circle cx="356" cy="402" r="8" fill="rgba(255,255,255,0.22)"/>

  <!-- Ground shadow -->
  <ellipse cx="256" cy="440" rx="52" ry="10" fill="rgba(0,0,0,0.18)"/>

  <!-- Main pin -->
  <g filter="url(#shadow)">
    <path d="M256 58
             C168 58 106 126 106 200
             C106 270 180 358 256 434
             C332 358 406 270 406 200
             C406 126 344 58 256 58 Z"
          fill="white"/>
  </g>

  <!-- Inner circle -->
  <circle cx="256" cy="194" r="80" fill="url(#bg)"/>

  <!-- Gold star -->
  <path d="M256,146
           L268,178 L302,179
           L275,200 L284,233
           L256,214
           L228,233 L237,200
           L210,179 L244,178 Z"
        fill="#fbbf24"/>

  <!-- Pin highlight -->
  <path d="M192 98 C168 116 150 148 144 178"
        stroke="rgba(255,255,255,0.38)" stroke-width="11"
        fill="none" stroke-linecap="round"/>
</svg>
